<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusCart | Register</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/toast.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

  <div class="auth-page">

    <div class="auth-card" style="width:min(520px,100%);">

      <div class="auth-logo">
        <div class="auth-logo-icon"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1" />
            <circle cx="20" cy="21" r="1" />
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
          </svg></div>
        <p class="auth-title">Create Your Account</p>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">

        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">
            Full Name <span class="required-mark">*</span>
          </label>
          <input type="text" class="form-input" id="reg-name" placeholder="Juan Dela Cruz" autocomplete="name" required>
        </div>

        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">
            School Email <span class="required-mark">*</span>
          </label>
          <input type="email" class="form-input" id="reg-email" placeholder="account@university.edu.ph"
            autocomplete="email" readonly required style="opacity: 0.7; cursor: not-allowed;">
        </div>

        <div class="form-group">
          <label class="form-label">
            Password <span class="required-mark">*</span>
          </label>
          <div class="input-eye-wrap">
            <input type="password" class="form-input" id="reg-pw" placeholder="••••••••" autocomplete="new-password" required>
            <button type="button" class="btn-eye" onclick="togglePw('reg-pw',this)" tabindex="-1"
              title="Show/hide password">
              <svg id="eye-icon-reg-pw" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">
            Confirm Password <span class="required-mark">*</span>
          </label>
          <div class="input-eye-wrap">
            <input type="password" class="form-input" id="reg-pw2" placeholder="••••••••" autocomplete="new-password" required>
            <button type="button" class="btn-eye" onclick="togglePw('reg-pw2',this)" tabindex="-1"
              title="Show/hide password">
              <svg id="eye-icon-reg-pw2" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">
            School / University <span class="required-mark">*</span>
          </label>

          <select class="form-select" id="reg-school" required>
            <option value="">Select…</option>
            <option value="De La Salle University">
              De La Salle University
            </option>
            <option value="University of Santo Tomas">
              University of Santo Tomas
            </option>
            <option value="Ateneo de Manila University">
              Ateneo de Manila University
            </option>
            <option value="University of the Philippines">
              University of the Philippines
            </option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group" id="reg-other-school-group" style="grid-column:1/-1;" hidden>
          <label class="form-label">
            Enter School / University <span class="required-mark">*</span>
          </label>

          <input type="text" class="form-input" id="reg-other-school" placeholder="Enter your school or university">
        </div>

        <div class="form-group">
          <label class="form-label">
            Course <span class="optional-label">(optional)</span>
          </label>
          <input type="text" class="form-input" id="reg-course" placeholder="e.g. BSECE">
        </div>

        <div class="form-group">
          <label class="form-label">
            Phone <span class="required-mark">*</span>
          </label>
          <div class="phone-input-wrap">
            <span class="phone-prefix">+63</span>
            <input type="tel" class="form-input with-phone-prefix" id="reg-phone" inputmode="numeric"
              placeholder="9XXXXXXXXX" maxlength="10"
              oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)" required>
          </div>
        </div>

      </div>

      <button class="auth-btn" onclick="handleRegister()">CREATE ACCOUNT</button>

      <div class="auth-footer">
        <button class="auth-link" onclick="window.location.href='../login-path/login.html'">already have an account?
          login here!</button>
      </div>

    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/toggleTheme.js"></script>
  <script src="../js/toastNotification.js"></script>
  <script src="../js/login.js"></script>

</body>

</html>
